<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#f7f7f5}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>ATTA Crew Scheduler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a real app shell. Left sidebar (logo, navigation, live crew list, emergency button) and a main canvas with a page header per view.
   Crew Board = unassigned rail + ten mechanic columns in two rows of five. Calendars = a 7:00 to 16:00 time grid, Mon to Fri, plus a month view.
   Brand: ATTA red (#d13f29) for selection and highlights, near-black for primary actions, job types as soft tints. Layered surfaces, hairlines, soft depth. */
:root{
  --bg:#f3f3f1; --canvas:#f7f7f5; --surface:#ffffff; --surface-2:#f4f4f2; --surface-3:#e9e9e5; --sidebar:#ffffff;
  --fg:#17181a; --fg-2:#3b3f45; --muted:#6f747c; --line:#e7e6e2; --line-strong:#d0cec8; --hair:rgba(23,24,26,.06);
  --brand:#d13f29; --brand-ink:#ffffff; --brand-soft:#fceae6; --brand-glow:rgba(209,63,41,.18);
  --primary:#1b1c1e; --primary-ink:#ffffff;
  --danger:#b42318; --danger-ink:#ffffff; --danger-soft:#fee4e2; --ok:#0a7a48; --ok-soft:#dcf5e7; --warn:#b54708; --warn-soft:#fdefc8;
  --t-maintenance:#0e8a5f; --t-repair:#d9700a; --t-modernization:#5b4fcf; --t-escalator:#b8327e; --t-inspection:#4b5563;
  --av-l:44%; --show-light:block; --show-dark:none;
  --shadow-xs:0 1px 1px rgba(23,24,26,.04);
  --shadow-sm:0 1px 2px rgba(23,24,26,.06),0 2px 6px rgba(23,24,26,.04);
  --shadow:0 4px 12px rgba(23,24,26,.07),0 16px 40px rgba(23,24,26,.10);
  --shadow-lg:0 12px 40px rgba(23,24,26,.16),0 40px 90px rgba(23,24,26,.14);
  --font-display:"Manrope",system-ui,sans-serif; --font-body:"DM Sans",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --canvas:#0e1114; --surface:#161a1f; --surface-2:#1c2127; --surface-3:#252b33; --sidebar:#111418;
    --fg:#eceef1; --fg-2:#c3c8cf; --muted:#8f97a3; --line:#242a31; --line-strong:#353d47; --hair:rgba(255,255,255,.06);
    --brand:#ee6046; --brand-ink:#1a0d0a; --brand-soft:#3a1e19; --brand-glow:rgba(238,96,70,.25);
    --primary:#f1f2f4; --primary-ink:#111214;
    --danger:#f3705f; --danger-ink:#1a0d0c; --danger-soft:#3b1c19; --ok:#3fcf8e; --ok-soft:#153327; --warn:#f5a623; --warn-soft:#3b2a10;
    --t-maintenance:#2fb98a; --t-repair:#f0913a; --t-modernization:#8b80ea; --t-escalator:#e05aa8; --t-inspection:#8a94a3;
    --av-l:50%; --show-light:none; --show-dark:block;
    --shadow-xs:0 1px 1px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3); --shadow:0 4px 14px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5); --shadow-lg:0 16px 48px rgba(0,0,0,.6),0 48px 100px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --canvas:#0e1114; --surface:#161a1f; --surface-2:#1c2127; --surface-3:#252b33; --sidebar:#111418;
  --fg:#eceef1; --fg-2:#c3c8cf; --muted:#8f97a3; --line:#242a31; --line-strong:#353d47; --hair:rgba(255,255,255,.06);
  --brand:#ee6046; --brand-ink:#1a0d0a; --brand-soft:#3a1e19; --brand-glow:rgba(238,96,70,.25);
  --primary:#f1f2f4; --primary-ink:#111214;
  --danger:#f3705f; --danger-ink:#1a0d0c; --danger-soft:#3b1c19; --ok:#3fcf8e; --ok-soft:#153327; --warn:#f5a623; --warn-soft:#3b2a10;
  --t-maintenance:#2fb98a; --t-repair:#f0913a; --t-modernization:#8b80ea; --t-escalator:#e05aa8; --t-inspection:#8a94a3;
  --av-l:50%; --show-light:none; --show-dark:block;
  --shadow-xs:0 1px 1px rgba(0,0,0,.3); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3); --shadow:0 4px 14px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5); --shadow-lg:0 16px 48px rgba(0,0,0,.6),0 48px 100px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
::selection{background:var(--brand-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- App shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:252px minmax(0,1fr)}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 16px;gap:8px;overflow:auto}
.sb-top{padding:4px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:32px;width:auto;display:block}
.logo-light{display:var(--show-light)} .logo-dark{display:var(--show-dark)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--fg-2);cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-selected="true"]{background:var(--brand-soft);color:var(--fg)}
.nav button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav button[aria-selected="true"] svg{color:var(--brand)}
.nav button svg{color:var(--muted)}
.nav .badge{margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.sb-section{margin-top:14px;flex:1;min-height:0;display:flex;flex-direction:column}
.sb-label{display:flex;justify-content:space-between;align-items:baseline;padding:0 12px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sb-label span{font-family:var(--font-mono);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}
.crewlist{display:flex;flex-direction:column;gap:1px;overflow:auto;padding-right:2px}
.crew{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"av name hrs" "av bar bar";column-gap:10px;row-gap:4px;align-items:center;width:100%;border:0;background:transparent;border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left;transition:background .15s}
.crew:hover{background:var(--surface-2)}
.crew.active{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.crew .av{grid-area:av}
.crew .cn{grid-area:name;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .ch{grid-area:hrs;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.crew .cb{grid-area:bar;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.crew .cb i{display:block;height:100%;background:var(--ok);border-radius:2px}
.crew .cb i.hot{background:var(--danger)}
.crew.over .cn::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.sb-bottom{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sb-bottom .btn{justify-content:center}
.sb-note{font-size:11.5px;color:var(--muted);line-height:1.4;padding:2px 4px 0;display:flex;gap:6px;align-items:flex-start}
.sb-note svg{width:13px;height:13px;margin-top:2px;color:var(--ok)}

main{min-width:0;background:radial-gradient(1100px 520px at 0% -10%,var(--brand-glow),transparent 60%),var(--canvas)}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:26px 30px 14px;animation:fadeUp .3s ease-out both}
.pagehead .ph-l{display:flex;align-items:center;gap:14px;min-width:0}
.pagehead h1{font-size:26px;font-weight:800;line-height:1.1}
.pagehead .sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.pagehead .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pagehead .back{width:36px;height:36px}
.content{padding:8px 30px 44px;animation:fadeUp .32s ease-out both;animation-delay:.04s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Primitives ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.5}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tpill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--tc,var(--fg));background:color-mix(in srgb,var(--tc,var(--fg)) 12%,var(--surface));line-height:1.6;white-space:nowrap}
.tpill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc,var(--fg))}
.tpill.urgent{--tc:var(--danger);background:var(--danger);color:var(--danger-ink)}
.tpill.urgent::before{background:var(--danger-ink)}
.spill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.6;white-space:nowrap}
.spill.onsite{background:var(--ok-soft);color:var(--ok)}
.spill.onsite::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
.spill.done{background:var(--surface-3);color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(145deg,hsl(var(--h,205) 42% calc(var(--av-l) + 8%)),hsl(var(--h,205) 45% calc(var(--av-l) - 6%)));color:#fff;font-family:var(--font-display);font-weight:800;font-size:12px;display:grid;place-items:center;letter-spacing:.02em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.15)}
.av.sm{width:26px;height:26px;font-size:9.5px}
.av.lg{width:44px;height:44px;font-size:15px}
.ring{width:38px;height:38px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3.6}
.ring .rb{stroke:var(--surface-3)}
.ring .rf{stroke:var(--ok);stroke-linecap:round;transition:stroke-dasharray .4s}
.ring.hot .rf{stroke:var(--danger)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:var(--shadow-xs);transition:background .15s,transform .06s,box-shadow .15s}
.btn:hover{background:var(--surface-2);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 92%,#fff),var(--primary));color:var(--primary-ink);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.brand{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 90%,#fff),var(--brand));color:var(--brand-ink);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.15),0 4px 14px var(--brand-glow)}
.btn.brand:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:transparent}
.btn.outline-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--surface)}
.btn.outline-danger:hover{background:var(--danger-soft)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:7px;box-shadow:none}
.btn.icon{padding:6px;width:34px;height:34px;justify-content:center}
.btn:disabled{opacity:.55;cursor:default}
:is(.nav button,.btn,.blk,.card,.chip,.mini,.mcell,.jobrow,.colhead,.seg button,.crew,.tabs button):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.weeknav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow-xs)}
.weeknav .btn{box-shadow:none;border-color:transparent;width:30px;height:30px}
.weeknav .label{font-family:var(--font-display);font-weight:700;font-size:13.5px;padding:0 8px;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:240px;padding:8px 12px 8px 34px;border-radius:10px;box-shadow:var(--shadow-xs)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
textarea,input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{min-height:104px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13.5px;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status.busy::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sold Jobs ---------- */
.sold{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow-sm)}
.panel h3{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.panel h3 svg{color:var(--brand)}
.panel .hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.form .full{grid-column:1/-1}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field label .ai{display:none;font-size:10px;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);padding:1px 7px;border-radius:999px}
.field.filled label .ai{display:inline-block}
.field.filled input,.field.filled select,.field.filled textarea{animation:fillflash 1.6s ease-out}
@keyframes fillflash{0%{background:var(--brand-soft);border-color:var(--brand)}100%{background:var(--surface)}}
.privacy{margin-top:16px;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:11px 14px}
.privacy svg{color:var(--ok);margin-top:1px}
.privacy strong{color:var(--fg)}
.joblist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.jobrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.jobrow:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.jobrow .t{font-weight:600;font-size:14px}
.jobrow .m{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- Crew Board ---------- */
.board{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);box-shadow:var(--shadow-sm)}
.rail h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.rail h3 svg{color:var(--warn)}
.rail .hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.rail .railtools{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cards{display:flex;flex-direction:column;gap:10px;min-height:60px;border-radius:12px}
.cards.over{outline:2px dashed var(--brand);outline-offset:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;cursor:grab;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s,border-color .14s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.45;transform:scale(.98)}
.card.urgent{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft),var(--shadow-sm)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;display:flex;gap:8px;align-items:flex-start;padding-right:28px}
.card .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc,var(--brand));flex:none;margin-top:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--tc,var(--brand)) 18%,transparent)}
.card .a{font-size:12.5px;color:var(--muted);margin:3px 0 0 16px}
.card .meta{display:flex;gap:8px;margin:9px 0 0 16px;font-family:var(--font-mono);font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}
.card .sugbtn{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--brand);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.card .sugbtn:hover{background:var(--brand-soft);transform:scale(1.06)}
.empty{border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13px}
.empty img{width:44px;opacity:.5;display:block;margin:0 auto 6px}
.columns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:230px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow-sm);transition:box-shadow .15s,opacity .15s;animation:fadeUp .4s ease-out both;animation-delay:calc(60ms + var(--i,0) * 35ms)}

/* ---------- Date helpers (local dates only, never UTC) ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = x.getDay(); return addDays(x, dow===0 ? 1 : 1-dow); };
const nextWeekday = d => { let x = addDays(d,1); while (x.getDay()===0 || x.getDay()===6) x = addDays(x,1); return x; };
const rollToWeekday = d => { let x = new Date(d); while (x.getDay()===0 || x.getDay()===6) x = addDays(x,1); return x; };
const fmtDate = s => { const d = parse(s); return DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate(); };
const fmtShort = s => { const d = parse(s); return MON[d.getMonth()]+" "+d.getDate(); };
const fmtTime = h => { const hh = Math.floor(h), mm = Math.round((h-hh)*60); const ap = hh>=12?"pm":"am"; const h12 = ((hh+11)%12)+1; return h12+":"+pad(mm)+" "+ap; };
const fmtHrs = h => (Number.isInteger(h) ? h : h.toFixed(1)) + " h";

/* A job that needs more than one working day (8 h) spills into the next weekday at 7:00. */
function segmentsFor(j){
  const segs = []; let d = rollToWeekday(parse(j.start));
  let from = Math.min(Math.max(j.startHour, DAY_START), DAY_END - 0.5); let rem = j.hours; let guard = 0;
  while (rem > 0 && guard++ < 80){
    const take = Math.min(rem, DAY_END - from, CAPACITY);   // a full day of work is 8 h; the rest spills to the next weekday
    segs.push({date: iso(d), from, to: from + take, job: j});
    rem -= take; d = nextWeekday(d); from = DAY_START;
  }
  return segs;
}
function daySegs(mechId, date){
  return state.jobs.filter(j => j.mechanic === mechId).flatMap(segmentsFor).filter(s => s.date === date).sort((a,b) => a.from - b.from);
}
function dayLoad(mechId, date){
  const segs = daySegs(mechId, date);
  const hours = segs.reduce((a,s) => a + (s.to - s.from), 0);
  let overlap = false;
  for (let i = 1; i < segs.length; i++) if (segs[i].from < segs[i-1].to - 1e-9) overlap = true;
  return {hours, overlap, over: hours > CAPACITY + 1e-9 || overlap, segs};
}
function weekDatesOf(dateStr){ const W = mondayOf(parse(dateStr)); return [0,1,2,3,4].map(n => iso(addDays(W,n))); }
function weekDates(){ const W = addDays(mondayOf(new Date()), weekOffset*7); return [0,1,2,3,4].map(n => iso(addDays(W,n))); }
function weekLabel(){ const ds = weekDates(); return fmtShort(ds[0]) + " to " + fmtShort(ds[4]); }
function weekOffsetOf(dateStr){ const W = mondayOf(new Date()); const d = mondayOf(parse(dateStr)); return Math.round((d - W) / (7*864e5)); }
function weekLoad(mechId, dateStr){ return weekDatesOf(dateStr).reduce((a,d) => a + dayLoad(mechId, d).hours, 0); }

/* ---------- Smart assignment: score every mechanic for a job and explain the score ---------- */
function areaScore(m, j){
  const c = cityOf(j.address); if (!c) return 1;
  const list = BASE_CITY[m.base] || [];
  if (list[0] && list[0].toLowerCase() === c.toLowerCase()) return 2;
  if (list.some(x => x.toLowerCase() === c.toLowerCase())) return 1;
  return 0;
}
function suggest(j){
  const isEsc = j.type === "escalator";
  return MECHANICS.map(m => {
    const trial = Object.assign({}, j, {mechanic: m.id});
    const segs = segmentsFor(trial);
    let fits = true, overlap = false;
    segs.forEach(s => {
      const L = dayLoad(m.id, s.date);
      if (L.hours + (s.to - s.from) > CAPACITY + 1e-9) fits = false;
      if (L.segs.some(o => o.job.id !== j.id && o.from < s.to && s.from < o.to)) overlap = true;
    });
    if (overlap) fits = false;
    const week = weekLoad(m.id, segs[0].date);
    const area = areaScore(m, j);
    const escCrew = m.base === "Escalator crew";
    let score = 0; const why = [];
    if (isEsc) { if (escCrew) { score += 6; why.push(["good","escalator crew"]); } else { score -= 4; why.push(["bad","not an escalator crew"]); } }
    else if (escCrew) { score -= 3; why.push(["bad","escalator crew, better kept for escalator work"]); }
    if (!fits) { score -= 6; why.push(["bad", overlap ? "already has a job at that time" : "would go over " + CAPACITY + " h that day"]); }
    else why.push(["good", "day stays under " + CAPACITY + " h"]);
    score += area * 1.5; why.push([area ? "good" : "", area === 2 ? "based in the area" : area === 1 ? "nearby" : "cross-town drive"]);
    score += (40 - week) / 8; why.push(["", fmtHrs(week) + " booked that week"]);
    return {m, score, fits, why};
  }).sort((a,b) => b.score - a.score);
}

async function runExtract(){
  const note = $("#note").value.trim();
  if (!note) { setStatus("Paste a job note first."); $("#note").focus(); return; }
  const btn = $("#extractBtn"); btn.disabled = true;
  setStatus("Reading the note…", true);
  const sample = await sampleReady;
  if (!sample) { fallback(note, "AI is not available in this view."); btn.disabled = false; return; }
  const today = new Date();
  const prompt =
    "You turn a raw elevator job note into fields for a crew scheduling board. Today is " + DOW[today.getDay()] + " " + TODAY + ".\n"
    + "Reply with only a JSON object with exactly these keys:\n"
    + '{"title": string (under 10 words, what the job is), "job_type": one of "maintenance" | "repair" | "modernization" | "escalator" | "inspection", '
    + '"address": string (street address, add ", Toronto" if no city is given), "start_date": "YYYY-MM-DD", "start_time": number (hour of day from 7 to 15.5, in 0.5 steps, default 7), '
    + '"hours": number (total hours of work, estimate from the work described if not stated), "parts": array of short strings (empty if none), "notes": string (one or two plain sentences for the mechanic)}\n'
    + "Rules: resolve a weekday like 'Mon' or 'next Tuesday' to the next such date after today. If no date is given use the next weekday. "
    + "'mod' means modernization. Never include any price, cost, quote or dollar amount in any field, even if the note has one.\n"
    + 'Example: {"title":"Door operator swap, car 3","job_type":"repair","address":"55 King St W, Toronto","start_date":"2026-10-08","start_time":7,"hours":4,"parts":["Door operator x1"],"notes":"Car 3 doors sticking. Swap operator and test."}\n\n'
    + "Job note:\n" + note.slice(0, 4000);
  try {
    const r = await sample.json(prompt, {modelTier: "quick"});
    if (!r || typeof r !== "object") throw {code: "invalid_json"};
    const hours = Number(r.hours); const st = Number(r.start_time);
    const start = /^\d{4}-\d{2}-\d{2}$/.test(String(r.start_date)) ? String(r.start_date) : iso(nextWeekday(today));
    const strip = s => String(s || "").replace(/\$\s?[\d,]+(?:\.\d+)?/g, "").replace(/\s{2,}/g, " ").trim();
    fillForm("f_", {
      title: strip(r.title).slice(0, 80), type: TYPES[r.job_type] ? r.job_type : "repair",
      hours: hours > 0 ? Math.round(hours*2)/2 : "", address: strip(r.address), start,
      startHour: (st >= DAY_START && st < DAY_END) ? Math.round(st*2)/2 : 7,
      parts: Array.isArray(r.parts) ? r.parts.map(strip).filter(Boolean) : [], desc: strip(r.notes)
    }, true);
    setStatus("Filled by AI. Check the fields, then add it.", false, priceNote(note));
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") setStatus("");
    else if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled") fallback(note, "AI is switched off for this page.");
    else if (code === "rate_limited") fallback(note, "AI is busy right now.");
    else fallback(note, "AI could not read that note.");
  }
  btn.disabled = false;
}
/* If the AI call fails for any reason the form still opens, with a few obvious fields guessed by simple rules, clearly marked. */
function fallback(note, why){
  const h = note.match(/(\d+(?:\.\d+)?)\s*(?:hrs?|hours?|h)\b/i);
  const a = note.match(/\bat\s+(\d+[^,;.\n]*?)(?=,|;|\.|\n|\s+needs?\b|\s+approx\b|\s+about\b|\s+start\b|$)/i);
  const dayIdx = DOW.findIndex(d => new RegExp("\\b" + d, "i").test(note));
  let start = iso(nextWeekday(new Date()));
  if (dayIdx > 0 && dayIdx < 6) { let d = addDays(new Date(), 1); while (d.getDay() !== dayIdx) d = addDays(d, 1); start = iso(d); }
  const type = /\bmod\b|moderni/i.test(note) ? "modernization" : /escalator/i.test(note) ? "escalator" : /maint/i.test(note) ? "maintenance" : /inspect|tssa/i.test(note) ? "inspection" : "repair";
  const clean = note.replace(/\$\s?[\d,]+(?:\.\d+)?/g, "").replace(/\s{2,}/g, " ").trim();
  fillForm("f_", { title: "", type, hours: h ? Math.round(Number(h[1])*2)/2 : "", address: a ? a[1].trim() : "", start, startHour: 7, parts: [], desc: clean.slice(0, 300) }, false);
  setStatus(why + " Fill in the rest by hand.", false, priceNote(note));
}

}

      + '<div class="loadring">' + ring(pct, overDays.length > 0) + '<span class="hrs">' + fmtHrs(weekHrs) + '</span></div></div>'
      + (overDays.length ? '<span class="flag">Over-booked ' + overDays.map(d => DOW[parse(d).getDay()]).join(", ") + '</span>' : '')
      + '</div><div class="colbody">' + chips + '</div></div>';
  }).join("");
  main.innerHTML =
    pageHead("Crew Board", "Drag a job onto a mechanic. It lands on their calendar. Click a name to open it.",
      '<label class="search">' + ICON.search + '<input id="boardSearch" type="search" placeholder="Find a job or address" value="' + esc(boardQuery) + '" aria-label="Find a job"></label>' + weekNav())
    + '<div class="content board"><aside class="rail"><h3>' + ICON.inbox + 'Unassigned <span class="pill warn">' + queue.length + '</span></h3><p class="hint">New sold jobs wait here until someone drags them onto a crew, or let the board pick.</p>'

  const s = $("#boardSearch"); s.addEventListener("input", () => { boardQuery = s.value; applyBoardFilter(); });

}
function applyBoardFilter(){
  const q = boardQuery.trim().toLowerCase();

  document.querySelectorAll(".col").forEach(col => { const any = [...col.querySelectorAll(".chip")].some(c => !c.hidden); col.classList.toggle("nomatch", !!q && !any); });

function cardHTML(j){

    + '<div class="meta">' + tpill(j.type) + urgentPill(j) + '<span>' + fmtDate(j.start) + (j.urgent ? " " + fmtTime(j.startHour) : "") + '</span><span>' + fmtHrs(j.hours) + '</span></div></div>';

function chipHTML(j, dates){
  const segs = segmentsFor(j);

  const inWeek = segs.some(s => dates.includes(s.date));

/* Mechanic calendar */
function renderMech(){
  const m = mech(calMech) || MECHANICS[0]; calMech = m.id;
  const dates = weekDates();
  const sel = '<select id="mechSel" style="width:auto;padding:7px 32px 7px 12px;border-radius:10px">' + MECHANICS.map(x => '<option value="' + x.id + '"' + (x.id === m.id ? " selected" : "") + '>' + esc(x.name) + '</option>').join("") + '</select>';
  let head = '<div class="corner"></div>';
  let cols = '';
  const now = new Date(); const nowH = now.getHours() + now.getMinutes()/60;
  dates.forEach(d => {
    const L = dayLoad(m.id, d);
    head += '<div class="dh' + (d === TODAY ? " today" : "") + (L.over ? " over" : "") + '">' + DOW[parse(d).getDay()] + '<span class="d">' + fmtShort(d) + '</span>'
          + (L.over ? '<span class="ob">' + (L.overlap ? "Overlapping jobs" : "Over-booked, " + fmtHrs(L.hours)) + '</span>' : (L.hours ? '<span class="ob" style="color:var(--muted)">' + fmtHrs(L.hours) + ' booked</span>' : '')) + '</div>';
    const blocks = L.segs.map(s => {
      const top = (s.from - DAY_START) * ROWH * 2, h = (s.to - s.from) * ROWH * 2;
      const size = h < 60 ? " short" : h < 96 ? " mid" : "";
      const conflict = L.segs.some(o => o !== s && o.from < s.to && s.from < o.to);
      const j = s.job, segs = segmentsFor(j), idx = segs.findIndex(x => x.date === s.date && x.from === s.from);
      const part = segs.length > 1 ? " (day " + (idx + 1) + " of " + segs.length + ")" : "";
      return '<div class="blk' + size + (conflict ? " conflict" : "") + stCls(j) + '" draggable="true" data-drag="' + j.id + '" data-action="open" data-id="' + j.id + '" tabindex="0" style="' + tc(j.type) + ';top:' + top + 'px;height:' + (h-3) + 'px" title="' + esc(j.title) + '">'
        + '<div class="t">' + (j.urgent ? "URGENT: " : "") + esc(j.title) + esc(part) + '</div><div class="a">' + esc(j.address) + '</div>'
        + '<div class="w">' + fmtTime(s.from) + ' to ' + fmtTime(s.to) + ' &middot; ' + fmtHrs(j.hours) + ' total' + (j.status !== "scheduled" ? ' &middot; ' + STATUS[j.status] : '') + '</div>'
        + '<div class="adj"><button type="button" data-action="adj" data-id="' + j.id + '" data-n="0.5" title="Add 30 minutes">+30 min</button>'
        + '<button type="button" data-action="adj" data-id="' + j.id + '" data-n="1" title="Add 1 hour">+1 hr</button>'
        + '<button type="button" data-action="adj" data-id="' + j.id + '" data-n="-0.5" title="Take off 30 minutes">&minus;30</button></div></div>';
    }).join("");
    const nowline = (d === TODAY && nowH >= DAY_START && nowH <= DAY_END) ? '<div class="nowline" style="top:' + ((nowH - DAY_START) * ROWH * 2) + 'px" title="Now"></div>' : "";
    cols += '<div class="daycol' + (d === TODAY ? " today" : "") + '" data-drop="slot" data-mech="' + m.id + '" data-date="' + d + '">' + blocks + nowline + '</div>';
  });
  let times = '';
  for (let h = DAY_START; h <= DAY_END; h++) times += '<span style="top:' + ((h - DAY_START) * ROWH * 2) + 'px">' + fmtTime(h) + '</span>';
  main.innerHTML =
    pageHead(esc(m.name), esc(m.base) + ' &middot; ' + fmtHrs(weekLoad(m.id, dates[0])) + ' booked this week',
      sel + '<button class="btn sm" data-action="daysheet" data-mech="' + m.id + '" type="button">' + ICON.phone + 'Day sheet</button><button class="btn sm" data-action="parts" data-mech="' + m.id + '" type="button">' + ICON.box + 'Parts this week</button>' + weekNav(),
      '<button class="btn icon ghost back" data-action="view" data-view="board" type="button" aria-label="Back to Crew Board">&larr;</button>' + avatar(m, "lg"))
    + '<div class="content"><div class="calwrap"><div class="calscroll"><div class="cal" style="--rows:' + ROWS + ';--rowh:' + ROWH + 'px">' + head + '<div class="times">' + times + '</div>' + cols + '</div></div>'
    + '<div class="calfoot"><span>Drag a job to another day or time. Use +30 min or +1 hr to stretch it. Click for details.</span>' + legendHTML() + '</div></div></div>';
  $("#mechSel").addEventListener("change", e => { calMech = e.target.value; render(); });
}
function legendHTML(){ return '<span style="margin-left:auto"></span>' + Object.entries(TYPES).map(([k,v]) => '<span class="legend" style="' + tc(k) + '"><i></i>' + v + '</span>').join(""); }

/* Team calendar, week */
function teamHead(){
  const toggle = '<div class="tabs small" role="group" aria-label="Zoom"><button type="button" data-action="teammode" data-mode="week" aria-selected="' + (teamMode === "week") + '">Week</button>'
    + '<button type="button" data-action="teammode" data-mode="month" aria-selected="' + (teamMode === "month") + '">Month</button></div>';
  return function(tools){ return pageHead("Team Calendar", (teamMode === "week" ? 'Everyone, one week. Red cells are over ' + CAPACITY + ' hours or have jobs on top of each other.' : 'The whole month at a glance. Click a day to open that week.'), toggle + tools); };
}
function stat(cls, icon, v, k){ return '<div class="stat ' + cls + '"><div class="ic">' + icon + '</div><div><div class="v">' + v + '</div><div class="k">' + k + '</div></div></div>'; }
function renderTeam(){
  const dates = weekDates();
  const queue = state.jobs.filter(j => !j.mechanic).sort((a,b) => (b.urgent - a.urgent) || a.start.localeCompare(b.start));
  let overCells = 0, overMechs = 0, weekHrs = 0;
  const rows = MECHANICS.map(m => {
    const loads = dates.map(d => dayLoad(m.id, d));
    const tot = loads.reduce((a,l) => a + l.hours, 0); weekHrs += tot;
    const anyOver = loads.some(l => l.over); if (anyOver) overMechs++;
    const cells = dates.map((d,i) => {
      const L = loads[i]; if (L.over) overCells++;
      const minis = L.segs.map(s => '<div class="mini' + stCls(s.job) + '" draggable="true" data-drag="' + s.job.id + '" data-action="open" data-id="' + s.job.id + '" tabindex="0" style="' + tc(s.job.type) + '" title="' + esc(s.job.title + ", " + s.job.address) + '"><b>' + fmtTime(s.from).replace(" ","") + '</b>' + esc(s.job.title) + '</div>').join("");
      return '<td><div class="cell' + (L.over ? " hot" : "") + '" data-drop="cell" data-mech="' + m.id + '" data-date="' + d + '">'
        + '<div class="hrs"><span>' + (L.hours ? fmtHrs(L.hours) : "") + '</span>' + (L.over ? '<span>' + (L.overlap ? "Overlap" : "Over " + CAPACITY + " h") + '</span>' : '') + '</div>' + minis + '</div></td>';
    }).join("");
    return '<tr><td class="who' + (anyOver ? " warn" : "") + '"><div class="row2">' + avatar(m) + '<div><div class="n">' + esc(m.name) + '</div><div class="b">' + esc(m.base) + '</div></div></div><div class="tot">' + fmtHrs(tot) + ' this week</div>'
      + '<button class="btn sm ghost" data-action="opencal" data-mech="' + m.id + '" type="button" style="margin-top:4px;margin-left:-10px">Open calendar &rarr;</button></td>' + cells + '</tr>';
  }).join("");
  const qrow = '<tr class="unassigned"><td class="who"><div class="n">Unassigned</div><div class="b">' + queue.length + ' waiting for a crew</div></td><td colspan="5"><div class="cell" data-drop="queue" style="flex-direction:row;flex-wrap:wrap">'
    + (queue.length ? queue.map(j => '<div class="mini' + stCls(j) + '" draggable="true" data-drag="' + j.id + '" data-action="open" data-id="' + j.id + '" tabindex="0" style="' + tc(j.type) + '" title="' + esc(j.address) + '"><b>' + fmtShort(j.start) + '</b>' + esc(j.title) + ' &middot; ' + fmtHrs(j.hours) + '</div>').join("") : '<span style="color:var(--muted);font-size:13px">Nothing waiting. Every sold job has a crew.</span>') + '</div></td></tr>';
  const head = '<tr><th>Crew</th>' + dates.map(d => '<th' + (d === TODAY ? ' class="today"' : '') + '>' + DOW[parse(d).getDay()] + '<span class="d">' + fmtShort(d) + '</span></th>').join("") + '</tr>';
  main.innerHTML = teamHead()('<button class="btn sm" data-action="briefing" type="button">' + ICON.note + 'Morning briefing</button><button class="btn sm" data-action="parts" data-mech="all" type="button">' + ICON.box + 'Parts to pull</button>' + weekNav())
    + '<div class="content"><div class="summary">'
    + stat(overCells ? "bad" : "good", ICON.alert, overCells, 'over-booked day' + (overCells === 1 ? "" : "s"))
    + stat(overMechs ? "bad" : "good", ICON.users, overMechs, 'mechanic' + (overMechs === 1 ? "" : "s") + ' to rebalance')
    + stat(queue.length ? "warn" : "good", ICON.inbox, queue.length, 'unassigned job' + (queue.length === 1 ? "" : "s"))
    + stat("", ICON.clock, Math.round(weekHrs), 'crew hours of ' + (MECHANICS.length * CAPACITY * 5))
    + '</div>'
    + '<div class="calwrap"><div class="calscroll"><table class="team">' + head + qrow + rows + '</table></div>'
    + '<div class="calfoot"><span>Drag a job into another cell to move it to that crew and day.</span>' + legendHTML() + '</div></div></div>';
}

/* Team calendar, month */
function renderMonth(){
  const now = new Date(); const first = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const nav = '<div class="weeknav"><button class="btn sm icon" data-action="month" data-n="-1" type="button" aria-label="Previous month">&larr;</button>'
    + '<span class="label">' + MONTH_LONG[first.getMonth()] + ' ' + first.getFullYear() + '</span>'
    + '<button class="btn sm icon" data-action="month" data-n="1" type="button" aria-label="Next month">&rarr;</button>'
    + (monthOffset ? '<button class="btn sm ghost" data-action="month" data-n="0" type="button">This month</button>' : '') + '</div>';
  let cells = ''; let d = mondayOf(first); let monthOver = 0, monthJobs = new Set(), monthHrs = 0;
  const cap = MECHANICS.length * CAPACITY;
  while (d <= last){
    for (let i = 0; i < 5; i++){
      const date = iso(addDays(d, i)); const dd = parse(date); const dim = dd.getMonth() !== first.getMonth();
      let hrs = 0, over = 0; const jobs = new Set();
      MECHANICS.forEach(m => { const L = dayLoad(m.id, date); hrs += L.hours; if (L.over) over++; L.segs.forEach(s => jobs.add(s.job.id)); });
      const un = state.jobs.filter(j => !j.mechanic && iso(rollToWeekday(parse(j.start))) === date).length;
      if (!dim) { monthOver += over; monthHrs += hrs; jobs.forEach(x => monthJobs.add(x)); }
      cells += '<div class="mcell' + (dim ? " dim" : "") + (date === TODAY ? " today" : "") + (over && !dim ? " hot" : "") + '" data-action="gotoweek" data-date="' + date + '" tabindex="0" role="button" title="Open the week of ' + fmtDate(date) + '">'
        + '<div class="dn">' + dd.getDate() + '</div>'
        + (jobs.size ? '<div class="ms"><b>' + jobs.size + '</b> job' + (jobs.size === 1 ? "" : "s") + ' &middot; ' + fmtHrs(hrs) + '</div>' : '')
        + ((over || un) ? '<div class="mf">' + (over ? '<span class="o">' + over + ' over-booked</span>' : '') + (un ? '<span class="u">' + un + ' unassigned</span>' : '') + '</div>' : '')
        + '<div class="mbar"><i style="width:' + Math.min(100, hrs / cap * 100).toFixed(0) + '%"></i></div></div>';
    }
    d = addDays(d, 7);
  }
  const head = ["Mon","Tue","Wed","Thu","Fri"].map(x => '<div class="mh">' + x + '</div>').join("");
  main.innerHTML = teamHead()(nav)
    + '<div class="content"><div class="summary">'
    + stat(monthOver ? "bad" : "good", ICON.alert, monthOver, 'over-booked crew day' + (monthOver === 1 ? "" : "s") + ' this month')
    + stat("", ICON.cal, monthJobs.size, 'jobs on the calendar')
    + stat("", ICON.clock, Math.round(monthHrs), 'crew hours booked')
    + '</div>'
    + '<div class="calwrap"><div class="calscroll"><div class="month">' + head + cells + '</div></div>'
    + '<div class="calfoot"><span>Bar under each day is how full the whole team is. Red days have at least one crew over ' + CAPACITY + ' hours.</span></div></div></div>';
}

/* ---------- Actions ---------- */
function assign(id, mechId, date, startHour, quiet){
  const j = job(id); if (!j) return null;
  snap();
  const before = {mechanic: j.mechanic};
  if (mechId !== undefined) j.mechanic = mechId;
  if (date) j.start = date;
  if (startHour != null) j.startHour = startHour;
  save(); if (!quiet) render();
  const m = j.mechanic ? mech(j.mechanic) : null;
  const seg = segmentsFor(j)[0];
  if (quiet) return {m, seg};
  if (!m) toast("Back in the unassigned queue.", [], "", true);
  else {
    const L = dayLoad(m.id, seg.date);
    let msg = (before.mechanic === m.id ? "Moved to " : "Assigned to " + m.name.split(" ")[0] + ". Lands ") + fmtDate(seg.date) + " at " + fmtTime(seg.from) + ".";
    let kind = "";
    if (L.over) { msg += " That day is now over-booked."; kind = "danger"; }
    else if (before.mechanic !== m.id && areaScore(m, j) === 0 && m.base !== "Escalator crew" && cityOf(j.address)) { msg += " Heads up: " + m.name.split(" ")[0] + " is based in " + m.base + " and this job is in " + cityOf(j.address) + "."; kind = "warn"; }
    else if (before.mechanic !== m.id && j.type === "escalator" && m.base !== "Escalator crew") { msg += " Heads up: this is escalator work and " + m.name.split(" ")[0] + " is not on the escalator crew."; kind = "warn"; }
    toast(msg, view === "mech" ? [] : [["Open calendar", () => { calMech = m.id; weekOffset = weekOffsetOf(seg.date); view = "mech"; render(); }]], kind, true);
  }
  return {m, seg};
}
function adjust(id, n){
  const j = job(id); if (!j) return;
  snap(); j.hours = Math.max(0.5, Math.round((j.hours + n) * 2) / 2); save(); render();
  const seg = segmentsFor(j); const L = j.mechanic ? dayLoad(j.mechanic, seg[seg.length-1].date) : null;
  toast(j.title + ": now " + fmtHrs(j.hours) + (seg.length > 1 ? ", runs to " + fmtDate(seg[seg.length-1].date) : "") + (L && L.over ? ". Over-booked." : "."), [], L && L.over ? "danger" : "", true);
  const el = document.querySelector('[data-drag="' + id + '"]'); if (el) el.focus();
}
function setJobStatus(id, status){
  const j = job(id); if (!j || !STATUS[status]) return;
  snap(); j.status = status; save();
}
function autoAssign(){
  const queue = state.jobs.filter(j => !j.mechanic).sort((a,b) => (b.urgent - a.urgent) || a.start.localeCompare(b.start));
  if (!queue.length) return;
  snap();
  const done = [];
  queue.forEach(j => { const best = suggest(j)[0]; j.mechanic = best.m.id; done.push(j.title + " → " + best.m.name.split(" ")[0] + (best.fits ? "" : " (tight)")); });
  save(); render();
  toast("Assigned " + done.length + " job" + (done.length === 1 ? "" : "s") + ": " + done.join("; ") + ".", [], "", true);
}

/* ---------- Dialogs ---------- */
function openDialog(html, wide){ const modal = $("#modal"); modal.innerHTML = '<div class="dialog' + (wide ? " wide" : "") + '" role="dialog" aria-modal="true"><img class="mark" src="' + MARK + '" alt="">' + html + '</div>'; modal.hidden = false; const f = modal.querySelector(".btn.primary,.btn.brand,button"); if (f) f.focus(); }
function closeModal(){ $("#modal").hidden = true; }
function actionsBar(inner){ return '<div class="actions">' + inner + '<span class="spacer"></span><button class="btn sm primary" data-action="close" type="button">Close</button></div>'; }

function openJob(id, edit){
  const j = job(id); if (!j) return;
  const m = j.mechanic ? mech(j.mechanic) : null; const segs = segmentsFor(j);
  const when = segs.length === 1 ? fmtDate(segs[0].date) + ", " + fmtTime(segs[0].from) + " to " + fmtTime(segs[0].to)
             : fmtDate(segs[0].date) + " " + fmtTime(segs[0].from) + " to " + fmtDate(segs[segs.length-1].date) + " " + fmtTime(segs[segs.length-1].to) + " (" + segs.length + " days)";

    ? '<form id="e_form" class="form">' + jobFields("e_") + '</form>'

    + '<dt>Status</dt><dd>' + statusSeg + '</dd>'
    + '<dt>Parts</dt><dd>' + (j.parts.length ? '<ul>' + j.parts.map(p => '<li>' + esc(p) + '</li>').join("") + '</ul>' : '<span style="color:var(--muted)">None listed</span>') + '</dd>'
    + '<dt>Notes</dt><dd>' + (j.desc ? esc(j.desc) : '<span style="color:var(--muted)">None</span>') + '</dd>'
    + '<dt>Pricing</dt><dd style="color:var(--muted)">Not stored here.</dd></dl>';
  const actions = edit
    ? '<div class="actions"><button class="btn sm primary" data-action="saveedit" data-id="' + j.id + '" type="button">Save changes</button><button class="btn sm ghost" data-action="open" data-id="' + j.id + '" type="button">Cancel</button></div>'
    : '<div class="actions"><button class="btn sm" data-action="adj" data-id="' + j.id + '" data-n="0.5" type="button">+30 min</button><button class="btn sm" data-action="adj" data-id="' + j.id + '" data-n="1" type="button">+1 hr</button>'
    + '<button class="btn sm" data-action="edit" data-id="' + j.id + '" type="button">Edit</button>'
    + (m ? '<button class="btn sm" data-action="unassign" data-id="' + j.id + '" type="button">Send back to queue</button>' : '<button class="btn sm brand" data-action="suggest" data-id="' + j.id + '" type="button">' + ICON.wand + 'Suggest a crew</button>')
    + '<span class="spacer"></span><button class="btn sm ghost" data-action="remove" data-id="' + j.id + '" type="button">Remove job</button><button class="btn sm primary" data-action="close" type="button">Close</button></div>';
  openDialog('<h3>' + esc(j.title) + '</h3><div class="sub">' + tpill(j.type) + urgentPill(j) + (m ? '<span style="display:inline-flex;align-items:center;gap:6px">' + avatar(m, "sm") + 'Assigned to ' + esc(m.name) + '</span>' : '<span class="pill warn">Unassigned</span>') + '</div>' + body + actions);
  if (edit) { fillForm("e_", j, false); $("#e_form").addEventListener("submit", ev => { ev.preventDefault(); saveEdit(j.id); }); }
}
function saveEdit(id){
  const j = job(id); if (!j) return;
  const v = readForm("e_"); if (!v.title || !v.address) { toast("Needs a description and an address."); return; }
  snap(); Object.assign(j, v); save(); render(); openJob(id); toast("Saved.", [], "", true);
}

/* Suggest a crew */
function openSuggest(id, title){
  const j = job(id); if (!j) return;
  const list = suggest(j).slice(0, 4);

function daySheetText(mechId, date){
  const m = mech(mechId); const segs = daySegs(mechId, date);

/* Parts to pull */
function partsFor(jobs){
  const map = new Map();
  jobs.forEach(j => j.parts.forEach(p => {
    const mm = String(p).match(/^(.*?)\s*[x×]\s*(\d+)\s*$/i); const name = (mm ? mm[1] : p).trim(); const qty = mm ? Number(mm[2]) : 1;
    const k = name.toLowerCase(); const e = map.get(k) || {name, qty: 0, jobs: []}; e.qty += qty; if (!e.jobs.includes(j.title)) e.jobs.push(j.title); map.set(k, e);
  }));
  return [...map.values()].sort((a,b) => a.name.localeCompare(b.name));
}
function weekJobs(mechId){ const dates = weekDates(); return state.jobs.filter(j => (mechId === "all" ? j.mechanic : j.mechanic === mechId) && segmentsFor(j).some(s => dates.includes(s.date))); }
function openParts(mechId){
  const all = mechId === "all";
  const groups = all ? MECHANICS.map(m => ({m, parts: partsFor(weekJobs(m.id))})).filter(g => g.parts.length) : [{m: mech(mechId), parts: partsFor(weekJobs(mechId))}];
  const html = groups.length && groups.some(g => g.parts.length)
    ? groups.map(g => (all ? '<div class="partgroup"><h4>' + avatar(g.m, "sm") + esc(g.m.name) + '</h4>' : '<div class="partgroup">') + '<div class="partlist">'
        + g.parts.map(p => '<div class="part"><div class="q">' + p.qty + '&times;</div><div><div class="n">' + esc(p.name) + '</div><div class="j">' + esc(p.jobs.join(" · ")) + '</div></div></div>').join("") + '</div></div>').join("")
    : '<div class="empty">No parts listed for this week.</div>';
  openDialog('<h3>Parts to pull</h3><div class="sub">' + (all ? "Whole team, " : esc(mech(mechId).name) + ", ") + weekLabel() + '. Added up from every job on the calendar, so the warehouse can stage them before Monday.</div>' + html
    + actionsBar('<button class="btn sm" data-action="copy" data-copy="parts" data-mech="' + mechId + '" type="button">' + ICON.copy + 'Copy list</button>'), all);
}
function partsText(mechId){
  const all = mechId === "all";
  const groups = all ? MECHANICS.map(m => ({m, parts: partsFor(weekJobs(m.id))})).filter(g => g.parts.length) : [{m: mech(mechId), parts: partsFor(weekJobs(mechId))}];
  const lines = ["ATTA parts to pull, " + weekLabel(), ""];
  groups.forEach(g => { lines.push(g.m.name); g.parts.forEach(p => lines.push("  " + p.qty + " x " + p.name + "  (" + p.jobs.join(", ") + ")")); lines.push(""); });
  return lines.join("\n").trim();
}

/* Morning briefing: facts from the board, written up by AI when available */
function briefingFacts(){
  const dates = weekDates(); const f = [];
  const over = []; MECHANICS.forEach(m => dates.forEach(d => { const L = dayLoad(m.id, d); if (L.over) over.push(m.name + " on " + fmtDate(d) + " (" + (L.overlap ? "two jobs overlap" : fmtHrs(L.hours)) + ")"); }));
  const queue = state.jobs.filter(j => !j.mechanic);
  const urgent = state.jobs.filter(j => j.urgent && j.status !== "done");
  const multi = state.jobs.filter(j => j.mechanic && segmentsFor(j).length > 1 && segmentsFor(j).some(s => dates.includes(s.date)));
  const hrs = MECHANICS.reduce((a,m) => a + dates.reduce((b,d) => b + dayLoad(m.id, d).hours, 0), 0);
  const parts = partsFor(weekJobs("all"));
  const onsite = state.jobs.filter(j => j.status === "onsite");
  f.push("Week: " + weekLabel() + ". " + Math.round(hrs) + " crew hours booked of " + (MECHANICS.length * CAPACITY * 5) + " (" + Math.round(hrs / (MECHANICS.length * CAPACITY * 5) * 100) + "% of capacity).");
  f.push(over.length ? "Over-booked: " + over.join("; ") + "." : "Nobody is over-booked.");
  f.push(queue.length ? "Unassigned: " + queue.map(j => j.title + " at " + j.address + " (" + fmtDate(j.start) + ", " + fmtHrs(j.hours) + ")").join("; ") + "." : "Every job has a crew.");
  if (urgent.length) f.push("Urgent: " + urgent.map(j => j.title + " at " + j.address + (j.mechanic ? ", " + mech(j.mechanic).name : ", nobody assigned")).join("; ") + ".");
  if (onsite.length) f.push("On site now: " + onsite.map(j => mech(j.mechanic).name.split(" ")[0] + " at " + j.address).join("; ") + ".");
  if (multi.length) f.push("Multi-day jobs this week: " + multi.map(j => j.title + " (" + mech(j.mechanic).name.split(" ")[0] + ", " + segmentsFor(j).length + " days)").join("; ") + ".");
  f.push(parts.length ? "Parts to stage this week: " + parts.map(p => p.qty + " x " + p.name).join(", ") + "." : "No parts listed this week.");
  return f;
}
async function openBriefing(){

/* Copy helper: clipboard where allowed, with a selectable fallback */
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); toast("Copied."); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied."); } catch (x) { toast("Select the text and copy it."); } ta.remove(); }
  if (btn) { const old = btn.innerHTML; btn.innerHTML = ICON.copy + "Copied"; setTimeout(() => { if (btn.isConnected) btn.innerHTML = old; }, 1500); }
}

function toast(msg, actions, kind, withUndo){
  const box = $("#toast"); const el = document.createElement("div"); el.className = "toastmsg " + (kind || "");
  el.innerHTML = '<span>' + esc(msg) + '</span>';
  (actions || []).forEach(([label, fn]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = () => { fn(); el.remove(); }; el.appendChild(b); });
  if (withUndo) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Undo"; b.onclick = () => { undo(); el.remove(); }; el.appendChild(b); }
  box.appendChild(el); while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => el.remove(), withUndo ? 7000 : 5200);
}

  e.preventDefault(); t.click();
});

/* Drag and drop: cards, chips, calendar blocks and mini chips all carry data-drag; drop zones carry data-drop. */
let dragId = null;
document.addEventListener("dragstart", e => {
  const t = e.target.closest && e.target.closest("[data-drag]"); if (!t) return;
  dragId = t.dataset.drag; t.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {}
});
document.addEventListener("dragend", e => { const t = e.target.closest && e.target.closest("[data-drag]"); if (t) t.classList.remove("dragging"); document.querySelectorAll(".over").forEach(z => z.classList.remove("over")); });
document.addEventListener("dragover", e => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if (!z || !dragId) return;
  e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (x) {}
  if (!z.classList.contains("over")) { document.querySelectorAll(".over").forEach(o => o.classList.remove("over")); z.classList.add("over"); }
});
document.addEventListener("dragleave", e => { const z = e.target.closest && e.target.closest("[data-drop]"); if (z && !z.contains(e.relatedTarget)) z.classList.remove("over"); });
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if (!z) return;
  e.preventDefault(); const id = dragId || (e.dataTransfer && e.dataTransfer.getData("text/plain")); dragId = null;
  document.querySelectorAll(".over").forEach(o => o.classList.remove("over"));
  if (!id || !job(id)) return;
  const kind = z.dataset.drop;
  if (kind === "queue") { if (job(id).mechanic) assign(id, null); return; }
  if (kind === "mech") { if (job(id).mechanic !== z.dataset.mech) assign(id, z.dataset.mech); return; }
  if (kind === "cell") { const j = job(id); if (j.mechanic !== z.dataset.mech || j.start !== z.dataset.date) assign(id, z.dataset.mech, z.dataset.date); return; }
  if (kind === "slot") {
    const rect = z.getBoundingClientRect(); const y = e.clientY - rect.top;
    const hour = Math.min(DAY_END - 0.5, Math.max(DAY_START, DAY_START + Math.floor(y / ROWH) * 0.5));
    assign(id, z.dataset.mech, z.dataset.date, hour);
  }
});

/* Keep the page's state across a live republish, if the viewer offers that hook. */
function start(){ render(); try { applyHash(); } catch (e) {} window.addEventListener("hashchange", () => { closeModal(); try { applyHash(); } catch (e) {} }); }
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({state, view, weekOffset, calMech, teamMode, monthOffset}));
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(data => { if (data && data.state && Array.isArray(data.state.jobs)) { state = data.state; view = data.view || view; weekOffset = data.weekOffset || 0; calMech = data.calMech || calMech; teamMode = data.teamMode || teamMode; monthOffset = data.monthOffset || 0; } start(); });
  else start();
} catch (e) { start(); }
})();
</script>
